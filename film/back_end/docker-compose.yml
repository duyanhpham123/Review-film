# Dịch vụ phụ khi dev. MySQL chạy bằng MySQL80 trên máy nên không có ở đây.
# Chạy: docker compose up -d
services:
  # Cache, đếm view, trending, rate limit
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Event outbox -> thông báo. Trang quản lý: http://localhost:15672 (guest / guest)
  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

  # Bắt mọi email gửi đi (xác thực email, quên mật khẩu). Xem tại http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  # Lưu ảnh (API S3 ở cổng 9000, giao diện quản lý http://localhost:9001, minioadmin / minioadmin).
  # Backend tự tạo bucket movie-web và cho đọc công khai khi khởi động.
  # MinIO đã ngừng phát hành image chính thức; dùng bản đóng gói của Chainguard.
  # Image này báo "file access denied" khi chạy bằng user mặc định, nên chạy root (chỉ dùng cho dev).
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  redis-data:
  rabbitmq-data:
  minio-data:
