spring.application.name=film
spring.config.import=optional:classpath:application-local.properties

server.port=${SERVER_PORT:8081}

# ===== Database (schema tạo bằng database/01_schema.sql, Hibernate không tự sửa bảng) =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/movie_web?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# Mật khẩu: đặt biến môi trường hoặc ghi vào application-local.properties (đã gitignore)
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# validate: khởi động mà DB thiếu bảng / cột so với entity thì báo lỗi ngay (không tự sửa bảng)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== JWT: bắt buộc cấu hình JWT_SECRET, tối thiểu 32 ký tự =====
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
app.jwt.refresh-expiration-remember-ms=2592000000
# true khi chạy HTTPS (production)
app.jwt.cookie-secure=${APP_COOKIE_SECURE:false}

# ===== Frontend (CORS + link trong email) =====
app.fe.base-url=${APP_FE_BASE_URL:http://localhost:5173}

# ===== Mail (dev: Mailpit ở cổng 1025, xem mail tại http://localhost:8025) =====
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
# SMTP thật khi deploy (Gmail, SendGrid, Mailgun...): bật auth + STARTTLS
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@reviewfilm.local}

# ===== Lưu ảnh: s3 (MinIO / S3, mặc định) hoặc local (thư mục uploads/, không cần MinIO) =====
app.storage.type=${STORAGE_TYPE:s3}
app.storage.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.storage.s3.region=${S3_REGION:us-east-1}
app.storage.s3.bucket=${S3_BUCKET:movie-web}
# minioadmin chỉ là mặc định khi dev; production đặt biến môi trường S3_ACCESS_KEY, S3_SECRET_KEY
app.storage.s3.access-key=${S3_ACCESS_KEY:minioadmin}
app.storage.s3.secret-key=${S3_SECRET_KEY:minioadmin}
# MinIO cần path-style (http://host:9000/bucket/key); AWS S3 thật để false
app.storage.s3.path-style=${S3_PATH_STYLE:true}
# Đổi thành domain CDN khi deploy, dữ liệu trong DB không phải sửa
app.storage.s3.public-base-url=${S3_PUBLIC_URL:http://localhost:9000/movie-web}
# Dev: tự tạo bucket và cho đọc công khai. Production tạo bucket bằng tay rồi để false
app.storage.s3.create-bucket=${S3_CREATE_BUCKET:true}
# Chỉ dùng khi app.storage.type=local
app.storage.local-dir=${STORAGE_DIR:uploads}
app.storage.public-base-url=${STORAGE_PUBLIC_URL:http://localhost:8081/files}
# Dọn ảnh mồ côi (không bảng nào trỏ tới) mỗi ngày 04:00 UTC, chỉ xóa file cũ hơn orphan-min-age
app.storage.cleanup-cron=0 0 4 * * *
app.storage.orphan-min-age=24h
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== Redis (docker compose up -d) =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
# Thời gian sống của cache
app.cache.movie-detail-ttl=5m
app.cache.movie-list-ttl=5m
app.cache.catalog-ttl=1h

# ===== RabbitMQ (docker compose up -d) =====
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Chờ broker xác nhận đã nhận message rồi mới đánh dấu outbox là đã gửi
spring.rabbitmq.publisher-confirm-type=simple
# Consumer lỗi thì thử lại 3 lần, vẫn lỗi thì chuyển sang hàng đợi DLQ
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ===== TMDB (import phim) =====
# Lấy key tại https://www.themoviedb.org/settings/api, đặt biến môi trường hoặc ghi vào application-local.properties.
# Chỉ cần một trong hai: TMDB_READ_TOKEN (API Read Access Token) hoặc TMDB_API_KEY.
app.tmdb.read-token=${TMDB_READ_TOKEN:}
app.tmdb.api-key=${TMDB_API_KEY:}
app.tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}
app.tmdb.image-base-url=https://image.tmdb.org/t/p
app.tmdb.language=vi-VN
# Phim bộ: số mùa tối đa lấy danh sách tập (mỗi mùa một request)
app.tmdb.max-seasons=10

# ===== Job =====
# Đọc outbox_events chưa gửi và đẩy lên RabbitMQ
app.outbox.fixed-delay-ms=5000
# Gom lượt xem từ Redis ghi xuống DB
app.views.flush-delay-ms=300000
# Đổi phim UPCOMING sang đã phát hành khi tới release_date (mỗi ngày 00:05 UTC)
app.release.cron=0 5 0 * * *

# ===== Health check (Docker / load balancer) =====
# Chỉ mở /actuator/health. liveness không phụ thuộc Redis/RabbitMQ/MinIO vì app vẫn chạy được khi chúng tắt.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.mail.enabled=false

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# ===== Swagger UI: http://localhost:8081/swagger-ui.html =====
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
