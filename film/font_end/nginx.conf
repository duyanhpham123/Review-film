# Frontend + API + ảnh trên cùng một domain.
#   /          -> file tĩnh của React (SPA, F5 không bị 404)
#   /api/      -> Spring Boot (cookie refresh token hoạt động vì cùng origin)
#   /media/    -> bucket MinIO (S3_PUBLIC_URL = https://<domain>/media)

upstream backend { server backend:8081; }
upstream minio   { server minio:9000; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 6m;          # ảnh tối đa 5MB, khớp với backend

    # Khi chạy sau Caddy (profile https): lấy IP thật của người dùng từ header Caddy gửi.
    # Chỉ tin đúng IP cố định của Caddy (docker-compose.prod.yml); không tin cả dải mạng Docker
    # vì request từ ngoài vào thường mang IP gateway của Docker, khi đó client giả được header.
    set_real_ip_from 172.30.0.10;
    real_ip_header X-Forwarded-For;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { access_log off; return 200 "ok"; }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ghi đè (không nối thêm) để client không giả được IP, dùng cho rate limit
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /media/ {
        proxy_pass http://minio/movie-web/;
        proxy_set_header Host minio:9000;
        proxy_hide_header Set-Cookie;
        # Chỉ cho đọc ảnh
        limit_except GET HEAD { deny all; }
    }

    # File build có hash trong tên: cache lâu dài
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        # index.html không cache để bản deploy mới có hiệu lực ngay
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ /index.html;
    }
}
